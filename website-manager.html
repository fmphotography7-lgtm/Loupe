<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudioFlow 9 · | Phase A UI Refresh</title>
<style>
:root{--navy:#19324a;--blue:#4f86a6;--ice:#dceff7;--pale:#eef4f7;--line:#cbd7de;--green:#ddefe3;--amber:#fff1cc;--red:#f8d7da;--ink:#20313c}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--pale);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:22px;margin:0} header small{color:#d9e7ef}
nav{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
nav button{background:#e8f0f4;color:var(--navy);border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
nav button.active{background:var(--blue);color:#fff}
main{max-width:1450px;margin:16px auto;padding:0 14px 40px}.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(25,50,74,.06)}
h2{margin:0 0 12px;color:var(--navy);font-size:20px}h3{color:var(--navy);margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:8px;border:1px solid #adbbc4;border-radius:7px;font:inherit}textarea{min-height:80px}
button{font:inherit}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:var(--blue);color:#fff}.ghost{background:#e8f0f4;color:var(--navy)}.danger{background:#963939;color:#fff}.success{background:#3f7551;color:#fff}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.note{padding:11px;border-radius:7px;background:var(--ice);border-left:5px solid var(--blue)}.warn{background:var(--amber);border-left-color:#d1a529}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px}.metric b{display:block;font-size:25px;color:var(--navy);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}th{background:var(--blue);color:#fff;position:sticky;top:0}td input,td select{padding:5px;font-size:12px}
.tablewrap{overflow:auto;max-height:510px;border:1px solid var(--line);border-radius:8px}.pill{padding:3px 8px;background:var(--ice);border-radius:20px;font-size:11px;font-weight:700}
.status{display:none;padding:10px;border-radius:7px;margin-top:9px}.status.ok{display:block;background:#178447;color:#fff;font-weight:800;border:1px solid #31a562;box-shadow:0 2px 8px rgba(0,0,0,.18)}.status.err{display:block;background:var(--red)}
.bar{height:16px;background:#dfe8ed;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}
.muted{font-size:12px;color:#657783}.rowcheck{display:flex;align-items:center;gap:6px}.rowcheck input{width:auto}
@media(max-width:900px){.grid,.grid3,.grid4,.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.grid3,.grid4,.metrics{grid-template-columns:1fr}}

.dropzone{border:2px dashed var(--blue);border-radius:10px;background:#f7fbfd;padding:18px;text-align:center;cursor:pointer;transition:.15s}
.dropzone.drag{background:var(--ice);border-color:var(--navy)}
.dropzone img{max-width:100%;max-height:240px;border-radius:7px;margin-top:10px}
.crop-layout{display:grid;grid-template-columns:minmax(300px,1.35fr) minmax(260px,.65fr);gap:14px}
.crop-stage{position:relative;background:#1d2730;border-radius:10px;min-height:460px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.crop-frame{position:relative;overflow:hidden;border:3px solid white;box-shadow:0 0 0 9999px rgba(0,0,0,.50);max-width:92%;max-height:92%;background:#111}
.crop-frame img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;pointer-events:none}
.crop-grid:before,.crop-grid:after{content:"";position:absolute;inset:0;pointer-events:none}
.crop-grid:before{background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.65) 33.3%,rgba(255,255,255,.65) 33.7%,transparent 33.8%,transparent 66.2%,rgba(255,255,255,.65) 66.3%,rgba(255,255,255,.65) 66.7%,transparent 66.8%)}
.crop-grid:after{background:linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.65) 33.3%,rgba(255,255,255,.65) 33.7%,transparent 33.8%,transparent 66.2%,rgba(255,255,255,.65) 66.3%,rgba(255,255,255,.65) 66.7%,transparent 66.8%)}
.range-line{display:grid;grid-template-columns:105px 1fr 42px;gap:8px;align-items:center;margin:9px 0}
.sku{font-family:Consolas,monospace;font-size:11px;white-space:nowrap}
@media(max-width:850px){.crop-layout{grid-template-columns:1fr}.crop-stage{min-height:360px}}


.gallery-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}
.gallery-toolbar button.active{background:var(--navy);color:white}
.gallery-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.gallery-summary-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:white;cursor:pointer}

.gallery-group{border:1px solid var(--line);border-radius:11px;background:white;margin-bottom:12px;overflow:hidden}

.gallery-west .gallery-group-head{background:#dceff7}
.gallery-wildlife .gallery-group-head{background:#dfeee2}
.gallery-world .gallery-group-head{background:#e6e1da}
.gallery-limited .gallery-group-head{background:#f2e7c9}
.art-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.art-card{border:1px solid var(--line);border-radius:10px;background:white;overflow:hidden}
.art-thumb{height:145px;background:#e9eff2;display:flex;align-items:center;justify-content:center;color:#6d7c85}
.art-thumb img{width:100%;height:100%;object-fit:cover}
.art-card-body{padding:10px}
.art-card-title{font-weight:700;color:var(--navy);margin-bottom:4px}
.art-card-meta{font-size:11px;color:#677985;margin-bottom:8px}
.art-card-actions{display:flex;gap:6px;flex-wrap:wrap}
.view-toggle{margin-left:auto;display:flex;gap:6px}
.gallery-empty{padding:18px;text-align:center;color:#6a7c86}
@media(max-width:900px){.gallery-summary{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.gallery-summary{grid-template-columns:1fr}.view-toggle{margin-left:0}}


.studio-grid{display:grid;grid-template-columns:310px 1fr 280px;gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.preview-shell{background:#1c2730;border-radius:12px;padding:12px;min-height:580px;display:flex;align-items:center;justify-content:center}
.room-canvas{position:relative;width:min(100%,900px);aspect-ratio:16/10;overflow:hidden;border-radius:9px;background:#ddd;box-shadow:0 8px 30px rgba(0,0,0,.22)}
.room-svg{position:absolute;inset:0;width:100%;height:100%}
.art-placement{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);cursor:move;user-select:none}
.art-frame{position:relative;background:white;box-shadow:0 10px 22px rgba(0,0,0,.28)}

.art-frame.canvas{padding:0;background:#111}
.art-frame.metal{padding:0;background:#d9dfe3;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.mat-wrap{background:#fff;display:flex;align-items:center;justify-content:center}
.frame-black{background:#191919}.frame-white{background:#fff}.frame-oak{background:#b98755}.frame-walnut{background:#69462f}
.control-row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:8px 0}
.room-card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.room-choice{border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;text-align:center;font-size:11px}
.room-choice.active{outline:3px solid var(--blue)}
.compare-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.compare-tile{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}
.compare-stage{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ddd;border-radius:7px}
.client-stage{position:relative;background:#242e35;border-radius:10px;min-height:560px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.client-stage img.room-photo{max-width:100%;max-height:760px;display:block}
.cal-point{position:absolute;width:16px;height:16px;border-radius:50%;background:#ffcf33;border:2px solid #222;transform:translate(-50%,-50%)}
.helpbox{background:#f6fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
.brand-preview{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
@media(max-width:1100px){.studio-grid{grid-template-columns:1fr}.preview-shell{min-height:450px}}

.save-state{display:flex;align-items:center;gap:7px;font-size:11px;color:#aebfc9;padding:9px 8px 0}.status-dot{width:8px;height:8px;border-radius:50%;background:#65c483;box-shadow:0 0 0 3px rgba(101,196,131,.15)}
.desktop-main{min-width:0;display:flex;flex-direction:column;height:100vh}.workspace-header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px}
.workspace-eyebrow{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.9px}.workspace-header h2{margin:2px 0 0;font-size:22px;color:var(--text)}
.workspace-actions{display:flex;gap:8px;align-items:center}.icon-btn,.avatar-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:800;cursor:pointer}.icon-btn:hover{background:var(--ice)}.avatar-btn{border-radius:50%;background:var(--blue);color:#fff;border:0}
.desktop-content{display:grid;grid-template-columns:minmax(0,1fr) 310px;flex:1;min-height:0}.workspace{overflow:auto;padding:16px 18px 40px}.inspector{background:#fff;border-left:1px solid var(--line);overflow:auto}.inspector-head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line)}.inspector-body{padding:13px}.inspector-empty{color:var(--muted);font-size:12px;line-height:1.55}.mini-btn{border:0;background:#edf3f6;border-radius:6px;width:27px;height:27px;cursor:pointer}

:root{
  --sf-navy:#122738;
  --sf-navy-2:#0c1c28;
  --sf-blue:#4f86a6;
  --sf-blue-2:#75b6d6;
  --sf-ice:#eaf7fc;
  --sf-surface:#ffffff;
  --sf-surface-2:#f7fafc;
  --sf-bg:#edf2f5;
  --sf-line:#d8e2e8;
  --sf-text:#1f303b;

  --sf-shadow:0 12px 34px rgba(18,39,56,.08);
  --sf-shadow-soft:0 5px 18px rgba(18,39,56,.06);
  --sf-radius:16px;
}
html{background:var(--sf-bg)}
body{font-family:"Segoe UI Variable",Inter,"Segoe UI",Arial,sans-serif;background:
  radial-gradient(circle at 88% 4%,rgba(117,182,214,.13),transparent 28%),
  linear-gradient(180deg,#f4f8fa 0%,var(--sf-bg) 38%,#e9eff2 100%);color:var(--sf-text)}
.desktop-app{grid-template-columns:268px 1fr;background:transparent}
.sidebar{background:
  radial-gradient(circle at 30% 0%,rgba(117,182,214,.18),transparent 30%),
  linear-gradient(180deg,var(--sf-navy),var(--sf-navy-2));box-shadow:12px 0 36px rgba(10,25,35,.12)}
.brand-block{padding:22px 18px 18px;gap:13px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(117,182,214,.18));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px rgba(0,0,0,.2);backdrop-filter:blur(12px)}

.side-nav button::before{width:24px;font-size:15px;opacity:.9}.sidebar-footer{padding:12px 12px 16px;background:rgba(0,0,0,.08)}.side-utility{border-radius:9px;padding:9px 10px}.save-state{padding-top:11px}.status-dot{background:#70d59a;box-shadow:0 0 0 4px rgba(112,213,154,.13)}

.workspace-eyebrow{color:var(--sf-blue);font-size:10px;letter-spacing:1.25px}.workspace-header h2{font-size:24px;font-weight:750;letter-spacing:-.35px;color:var(--sf-text)}
.workspace-actions{gap:9px}.icon-btn,.avatar-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--sf-line);background:rgba(255,255,255,.9);box-shadow:var(--sf-shadow-soft);transition:.18s}.icon-btn:hover{transform:translateY(-1px);background:var(--sf-ice);border-color:#bfd6e2}.avatar-btn{background:linear-gradient(145deg,#6aa8c8,#376f8e);box-shadow:0 7px 18px rgba(55,111,142,.24);font-size:12px}
.desktop-content{grid-template-columns:minmax(0,1fr) 320px}.workspace{padding:22px 24px 52px}.inspector{background:rgba(255,255,255,.86);backdrop-filter:blur(15px);border-left:1px solid rgba(203,217,225,.85)}.inspector-head{height:54px;padding:0 15px}.inspector-body{padding:15px}.inspector-thumb{height:190px;border-radius:13px;box-shadow:var(--sf-shadow-soft)}
.page.active{animation:sfPageIn .22s ease-out}@keyframes sfPageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{border:1px solid rgba(210,222,229,.92);border-radius:var(--sf-radius);padding:19px;margin-bottom:16px;background:rgba(255,255,255,.94);box-shadow:var(--sf-shadow);transition:box-shadow .18s,border-color .18s}.card:hover{border-color:#c8d9e2;box-shadow:0 15px 38px rgba(18,39,56,.095)}
h2{font-size:21px;letter-spacing:-.2px;color:var(--sf-navy);margin-bottom:14px}h3{font-size:16px;letter-spacing:-.1px}label{font-size:11px;letter-spacing:.25px;text-transform:uppercase;color:#5f727e;margin-bottom:6px}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function slug(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function money(n){return '$'+Number(n||0).toFixed(2)}
function titleUnique(title,exclude=''){return !state.artworks.some(a=>a.artworkId!==exclude&&a.title.trim().toLowerCase()===title.trim().toLowerCase())}

function sanitizeSkuPart(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function skuCode(v){
 let m=(v.material||'').toLowerCase(),p=(v.presentation||'').toLowerCase(),c='';
 if(m==='art card')c='CARD';
 else if(m.includes('metallic')&&p.includes('matted'))c='MM';
 else if(m.includes('metallic'))c='MP';
 else if(m.includes('luster')&&p.includes('matted'))c='LM';
 else if(m.includes('luster'))c='LP';
 else if(m==='canvas')c='C';
 else if(m==='metal')c='M';
 else c=(v.material||'CU').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,4).toUpperCase()||'CU';
 let size=sanitizeSkuPart(v.size);
 let pres=(!['','print only','matted','ready to hang','card'].includes(p))?'-'+sanitizeSkuPart(v.presentation).slice(0,5):'';
 return c+size+pres;
}
function autoSKU(a,v){return sanitizeSkuPart(a.artworkId)+'-'+skuCode(v)}
function allGeneratedSkus(excludeArtworkId=''){
 let list=[];
 state.artworks.filter(a=>a.artworkId!==excludeArtworkId).forEach(a=>(a.variants||[]).filter(v=>v.include!==false).forEach(v=>list.push(autoSKU(a,v))));
 return list;
}
function validateSkuSet(a,variants){
 let active=variants.filter(v=>v.include!==false),skus=active.map(v=>autoSKU(a,v)),seen=new Set;
 for(let s of skus){if(seen.has(s))return 'Duplicate generated SKU: '+s;seen.add(s)}
 let other=new Set(allGeneratedSkus(a.artworkId)),collision=skus.find(s=>other.has(s));
 return collision?'SKU already used by another artwork: '+collision:'';
}

function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}

function fileToDataURL(file,callback){
 if(!file||!file.type.startsWith('image/'))return callback(null,'Please choose an image file.');
 let reader=new FileReader();reader.onload=()=>callback(reader.result,null);reader.onerror=()=>callback(null,'The image could not be read.');reader.readAsDataURL(file);
}
function filenameTitle(name){return String(name||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim()}
function setTransientArtworkImage(artworkId,file,dataUrl,w,h){imageSessions[artworkId||'new']={dataUrl,filename:file.name,w,h}}
function setupDropZone(id,onFile){
 let zone=document.getElementById(id);if(!zone)return;
 ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('drag')}));
 ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('drag')}));
 zone.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)onFile(f)});
 zone.addEventListener('click',()=>{let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>input.files[0]&&onFile(input.files[0]);input.click()});
}
function handleArtworkDrop(file,oldId=''){
 fileToDataURL(file,(url,err)=>{if(err)return setStatus('aeStatusMsg',err,false);
  let img=new Image();img.onload=()=>{
   let id=document.getElementById('aeId').value||oldId||'new';
   setTransientArtworkImage(id,file,url,img.naturalWidth,img.naturalHeight);
   let title=document.getElementById('aeTitle');if(!title.value.trim())title.value=filenameTitle(file.name);
   document.getElementById('aeOrient').value=img.naturalWidth===img.naturalHeight?'Square':(img.naturalWidth>img.naturalHeight?'Landscape':'Portrait');
   let z=document.getElementById('artDrop');z.innerHTML='<b>'+esc(file.name)+'</b><br><span class="muted">'+img.naturalWidth+' × '+img.naturalHeight+' px</span><br><img src="'+url+'" alt="">';
   setStatus('aeStatusMsg','Image loaded locally for preview. Add the hosted Squarespace image URL before generating the final CSV.');
  };img.src=url;
 });
}

function aspectOptionsForArtwork(a){

function cropSourceRect(imgW,imgH,targetRatio,xPct,yPct){

function clientStageClick(e){if(!clientRoomData||calPoints.length>=2)return;let r=e.currentTarget.getBoundingClientRect();calPoints.push({x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});if(calPoints.length===2){let dx=(calPoints[1].x-calPoints[0].x)/100*clientNatural.w,dy=(calPoints[1].y-calPoints[0].y)/100*clientNatural.h,pix=Math.hypot(dx,dy),inch=+document.getElementById('knownDistance').value||1;clientPPI=pix/inch}renderClientCanvas()}

function renderUpdates(){

async function loadLiveCSV(file){if(!file)return;let matrix=parseCSV(await file.text()),headers=matrix[0],objects=matrix.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??'']))),ps=[],cur=null;objects.forEach(r=>{if(r['Product ID [Non Editable]']){cur={title:r.Title,url:r['Product URL'],productId:r['Product ID [Non Editable]'],visible:r.Visible,rows:[]};ps.push(cur)}if(cur)cur.rows.push(r)});liveStore={headers,products:ps};setStatus('updStatus','Loaded '+ps.length+' Squarespace products.');compareUpdate()}
function liveProduct(a){let c=liveStore.products.filter(p=>p.title.trim().toLowerCase()===a.title.trim().toLowerCase());c.sort((x,y)=>(y.visible==='Yes')-(x.visible==='Yes')||y.rows.length-x.rows.length);return c[0]}
function parseLiveVariant(r){let m=r['Option Value 1']||'',size=r['Option Value 2']||'',p='';if(m.includes(' - ')){let parts=m.split(' - '),tail=parts.pop();if(['Print Only','Matted'].includes(tail)){p=tail;m=parts.join(' - ')}}if(!p)p=m==='Art Card'?'Card':(['Canvas','Metal'].includes(m)?'Ready to Hang':'Print Only');return {material:m,size,presentation:p,price:+r.Price||0}}
function compareUpdate(){let a=state.artworks.find(x=>x.artworkId===document.getElementById('updArt')?.value);if(!a){document.getElementById('comparison').innerHTML='';return}let p=liveProduct(a);if(!p){document.getElementById('comparison').innerHTML='<div class="warn note">No matching product found in the loaded export. Generate a new/replacement product.</div>';return}let live=p.rows.map(parseLiveVariant),want=a.variants.filter(v=>v.include!==false),key=v=>(materialLabel(v)+'|'+v.size).toLowerCase(),lm=new Map(live.map(v=>[key(v),v])),wm=new Map(want.map(v=>[key(v),v])),missing=[...wm].filter(([k])=>!lm.has(k)).map(x=>x[1]),extra=[...lm].filter(([k])=>!wm.has(k)).map(x=>x[1]),price=[...wm].filter(([k,v])=>lm.has(k)&&Math.abs(lm.get(k).price-v.price*editionMultiplier(a))>.009).map(([k,v])=>({desired:v,live:lm.get(k)}));document.getElementById('comparison').innerHTML=`<div class="grid3"><div class="metric">Missing live<b>${missing.length}</b></div><div class="metric">Extra live<b>${extra.length}</b></div><div class="metric">Price changes<b>${price.length}</b></div></div><div class="grid" style="margin-top:10px"><div><h3>Missing</h3>${missing.map(v=>`<div>${esc(materialLabel(v))} · ${esc(v.size)}</div>`).join('')||'None'}</div><div><h3>Extra</h3>${extra.map(v=>`<div>${esc(materialLabel(v))} · ${esc(v.size)}</div>`).join('')||'None'}</div></div>`}
function exportReplacement(){let a=state.artworks.find(x=>x.artworkId===document.getElementById('updArt').value);if(!a)return setStatus('updStatus','Select an artwork.',false);let headers=liveStore.headers.length?liveStore.headers:SQ_HEADERS,rows=productRows(a,headers,'-replacement');download(slug(a.gallery)+'_'+slug(a.title)+'_replacement.csv',rowsToCSV(headers,rows));a.dirty=false;saveState()}
function exportPriceOnly(){let a=state.artworks.find(x=>x.artworkId===document.getElementById('updArt').value),p=a&&liveProduct(a);if(!p)return setStatus('updStatus','Load a Squarespace CSV and select a matching artwork.',false);let wanted=new Map(a.variants.filter(v=>v.include!==false).map(v=>[(materialLabel(v)+'|'+v.size).toLowerCase(),v])),rows=p.rows.map(r=>{let v=parseLiveVariant(r),w=wanted.get((materialLabel(v)+'|'+v.size).toLowerCase());if(w)r.Price=(w.price*editionMultiplier(a)).toFixed(2);return r});download(slug(a.title)+'_price_update.csv',rowsToCSV(liveStore.headers,rows));a.dirty=false;saveState()}

function normalizeVariantText(v){return String(v||'').toLowerCase().replace(/metallic luster paper/g,'metallic luster').replace(/luster paper/g,'luster').replace(/\s+/g,' ').trim()}
function priceVariantKey(v){return [normalizeVariantText(v.material),normalizeVariantText(v.size).replace(/\s*x\s*/g,'x'),normalizeVariantText(v.presentation)].join('|')}
function pricingExpectedMap(){const m=new Map();(state.pricing||[]).forEach(p=>m.set(priceVariantKey(p),Number(p.retail||0)));return m}
function buildPriceAudit(){
 const expected=pricingExpectedMap(),groups=new Map();
 (state.artworks||[]).forEach(a=>(a.variants||[]).filter(v=>v.include!==false).forEach(v=>{const key=priceVariantKey(v);if(!groups.has(key))groups.set(key,[]);groups.get(key).push({artwork:a,variant:v,price:Number(v.price||0),key})}));
 const rows=[];groups.forEach((items,key)=>{const prices=[...new Set(items.map(x=>x.price))],standard=expected.get(key);if(prices.length>1||(standard!=null&&items.some(x=>x.price!==standard))){items.forEach(x=>{const target=standard!=null?standard:modePrice(items.map(i=>i.price));if(x.price!==target)rows.push({...x,target,diff:x.price-target})})}});return rows.sort((a,b)=>a.key.localeCompare(b.key)||a.artwork.title.localeCompare(b.artwork.title))
}
function modePrice(values){const c={};values.forEach(v=>c[v]=(c[v]||0)+1);return Number(Object.entries(c).sort((a,b)=>b[1]-a[1]||Number(b[0])-Number(a[0]))[0]?.[0]||0)}
function renderPriceAudit(){const rows=buildPriceAudit(),variants=new Set(rows.map(r=>r.key)).size;return `<div class="card"><h2>Price Consistency Audit</h2><p>Compares every artwork using the exact combination of material, size, and presentation.</p><div class="price-audit-summary"><div class="price-audit-card">Affected products<b>${new Set(rows.map(r=>r.artwork.artworkId)).size}</b></div><div class="price-audit-card">Variant conflicts<b>${variants}</b></div><div class="price-audit-card">Incorrect prices<b>${rows.length}</b></div><div class="price-audit-card">Catalogue checked<b>${state.artworks.length}</b></div></div><div class="actions"><button class="btn secondary" onclick="exportPriceAuditCSV()">Export audit CSV</button><button class="btn success" onclick="applyAllStandardPrices()" ${rows.length?'':'disabled'}>Apply all standard prices</button></div>${rows.length?`<div class="tablewrap"><table class="price-audit-table"><thead><tr><th>Artwork</th><th>Material</th><th>Size</th><th>Presentation</th><th>Current</th><th>Expected</th><th>Difference</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.artwork.artworkId)} · ${esc(r.artwork.title)}</td><td>${esc(r.variant.material)}</td><td>${esc(r.variant.size)}</td><td>${esc(r.variant.presentation)}</td><td>${money(r.price)}</td><td>${money(r.target)}</td><td class="price-diff ${r.diff<0?'price-low':'price-high'}">${r.diff>0?'+':''}${money(r.diff)}</td><td><button class="btn sf104-fix" onclick="fixAuditPrice('${esc(r.artwork.artworkId)}','${encodeURIComponent(r.key)}',${r.target})">Fix</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="note"><b>All prices are consistent.</b> No mismatched variants were found.</div>'}</div>`}
function fixAuditPrice(artworkId,keyEncoded,target){const key=decodeURIComponent(keyEncoded),a=state.artworks.find(x=>x.artworkId===artworkId);if(!a)return;(a.variants||[]).forEach(v=>{if(priceVariantKey(v)===key)v.price=Number(target)});a.dirty=true;saveState();renderPricing()}
function applyAllStandardPrices(){if(!confirm('Apply the expected price to every mismatched variant?'))return;buildPriceAudit().forEach(r=>{r.variant.price=r.target;r.artwork.dirty=true});saveState();renderPricing();alert('Standard prices applied. Use Update Manager to generate Squarespace corrections.')}
function exportPriceAuditCSV(){const rows=buildPriceAudit(),csv=[['Artwork ID','Title','Material','Size','Presentation','Current Price','Expected Price','Difference'],...rows.map(r=>[r.artwork.artworkId,r.artwork.title,r.variant.material,r.variant.size,r.variant.presentation,r.price,r.target,r.diff])];download('StudioFlow_Price_Consistency_Audit.csv',toCSV(csv),'text/csv')}
const _sfRenderPricing=renderPricing;renderPricing=function(){_sfRenderPricing();document.getElementById('pricing').insertAdjacentHTML('beforeend',renderPriceAudit())}
const _sfRenderHealth=renderHealth;renderHealth=function(){_sfRenderHealth();document.getElementById('health').insertAdjacentHTML('beforeend',renderPriceAudit())}
</script>

function sf84CropPresets(){let custom=[];try{custom=JSON.parse(localStorage.getItem('sfCustomCropPresets')||'[]')}catch{};const base=[['Original',0,0],['5 × 7',5,7],['9 × 13',9,13],['13 × 19',13,19],['17 × 25',17,25],['20 × 40',20,40],['24 × 36',24,36],['30 × 60',30,60],['Square',1,1]];const seen=new Set;return base.concat(custom).filter(x=>{let k=`${x[1]}x${x[2]}`;if(seen.has(k))return false;seen.add(k);return true})}

function populateCropPresets(selected){const sel=document.getElementById('cropRatio');if(!sel)return;sel.innerHTML=sf84CropPresets().map(([name,w,h])=>`<option value="${w&&h?w+'/'+h:'0'}" ${selected===w+'/'+h?'selected':''}>${esc(name)}</option>`).join('')}
function saveCustomCropPreset(){let w=+document.getElementById('customCropW').value,h=+document.getElementById('customCropH').value;if(!(w>0&&h>0))return setStatus('cropStatus','Enter a valid width and height.',false);let items=[];try{items=JSON.parse(localStorage.getItem('sfCustomCropPresets')||'[]')}catch{};if(!items.some(x=>+x[1]===w&&+x[2]===h))items.push([`${w} × ${h}`,w,h]);localStorage.setItem('sfCustomCropPresets',JSON.stringify(items));populateCropPresets(w+'/'+h);document.getElementById('cropRatio').value=w+'/'+h;updateCropFrame();setStatus('cropStatus',`Saved ${w} × ${h} for future crops.`)}

<script id="sf91-behaviour-patch">
(function(){
 const PHI=(1+Math.sqrt(5))/2;
 window.sf91PendingPriceUpdates=function(){if(!Array.isArray(state.pendingPriceUpdates))state.pendingPriceUpdates=[];return state.pendingPriceUpdates};
 window.sf91QueuePriceUpdate=function(a,v,oldPrice,newPrice){
   const q=sf91PendingPriceUpdates(),key=[a.artworkId,priceVariantKey(v)].join('|');
   const item={id:key,artworkId:a.artworkId,title:a.title,material:v.material,size:v.size,presentation:v.presentation,oldPrice:Number(oldPrice),newPrice:Number(newPrice),createdAt:new Date().toISOString(),status:'Pending Squarespace export'};
   const i=q.findIndex(x=>x.id===key);if(i>=0)q[i]=item;else q.push(item);
 };
 const oldFix=window.fixAuditPrice;
 window.fixAuditPrice=function(artworkId,keyEncoded,target){

 };

 };

 };

 }

<script id="sf104-price-audit-actions-patch">
(function(){
  const dismissed=()=>{state.priceAuditDismissed=Array.isArray(state.priceAuditDismissed)?state.priceAuditDismissed:[];return state.priceAuditDismissed};
  const auditId=r=>[r.artwork.artworkId,r.key].join('::');
  const rawBuildPriceAudit=window.buildPriceAudit;
  window.buildPriceAudit=function(){

  window.sf104MarkAuditUpdated=function(button,artworkId,keyEncoded,current,target){
    const key=decodeURIComponent(keyEncoded);

    }

  };
  window.sf104ExportSelectedAuditCSV=function(){

    const a=state.artworks.find(x=>x.artworkId===selection.artworkId);
    if(!a)return alert('The selected artwork could not be found. Return to Price Audit and select it again.');
    if(!liveStore||!liveStore.headers?.length||!liveStore.products?.length)return alert('Load your latest Squarespace product export first.');
    const p=liveProduct(a);
    if(!p)return alert('No matching Squarespace product was found for “'+a.title+'”.');
    let matched=false;
    const rows=p.rows.map(source=>{
      const r={...source};
      const parsed=parseLiveVariant(r);
      if(priceVariantKey(parsed)===selection.key){r.Price=Number(selection.target||0).toFixed(2);matched=true}
      return r;
    });
    if(!matched)return alert('The selected variant was not found in the loaded Squarespace export.');
    const filename=slug(a.title)+'_selected_price_update.csv';

  window.renderPriceAudit=function(){
    const rows=buildPriceAudit(),variants=new Set(rows.map(r=>r.key)).size;
    return `<div class="card"><h2>Price Consistency Audit</h2><p>Compares every artwork using the exact combination of material, size, and presentation.</p><div class="price-audit-summary"><div class="price-audit-card">Affected products<b>${new Set(rows.map(r=>r.artwork.artworkId)).size}</b></div><div class="price-audit-card">Variant conflicts<b>${variants}</b></div><div class="price-audit-card">Incorrect prices<b>${rows.length}</b></div><div class="price-audit-card">Catalogue checked<b>${state.artworks.length}</b></div></div><div class="actions"><button class="btn secondary" onclick="exportPriceAuditCSV()">Export audit CSV</button><button class="btn success" onclick="applyAllStandardPrices()" ${rows.length?'':'disabled'}>Apply all standard prices</button></div>${rows.length?`<div class="tablewrap"><table class="price-audit-table"><thead><tr><th>Artwork</th><th>Material</th><th>Size</th><th>Presentation</th><th>Current</th><th>Expected</th><th>Difference</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.artwork.artworkId)} · ${esc(r.artwork.title)}</td><td>${esc(r.variant.material)}</td><td>${esc(r.variant.size)}</td><td>${esc(r.variant.presentation)}</td><td>${money(r.price)}</td><td>${money(r.target)}</td><td class="price-diff ${r.diff<0?'price-low':'price-high'}">${r.diff>0?'+':''}${money(r.diff)}</td><td><div class="sf104-audit-actions"><button class="btn sf104-fix" onclick="fixAuditPrice('${esc(r.artwork.artworkId)}','${encodeURIComponent(r.key)}',${r.target})">Fix</button><button class="btn sf104-create-csv" onclick="sf104SelectAuditCSV('${esc(r.artwork.artworkId)}','${encodeURIComponent(r.key)}',${r.target})">Create CSV</button><button class="btn sf104-updated" onclick="sf104MarkAuditUpdated(this,'${esc(r.artwork.artworkId)}','${encodeURIComponent(r.key)}',${r.price},${r.target})">Updated</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="note"><b>All prices are consistent or marked updated.</b> No active mismatched variants were found.</div>'}</div>`;
  };
  const baseRenderUpdates=window.renderUpdates;
  window.renderUpdates=function(){
    baseRenderUpdates();
    let selection={};try{selection=JSON.parse(sessionStorage.getItem('sf104AuditCSVSelection')||'{}')}catch{}
    if(!selection.artworkId)return;

    const host=document.getElementById('updates');const first=host?.querySelector('.card');if(!host||!first)return;

    first.after(box);

<style id="sf1149-pricing-safety-style">
.sf1149-protected{border:1px solid #c7923f!important;background:#2e2920!important}.sf1149-protected .note{background:#fff4dc!important;color:#241a09!important}.sf1149-status{display:inline-flex;padding:4px 9px;border-radius:999px;background:#664e26;color:#ffe0a3;font-size:12px;font-weight:800}.sf1149-export-summary{margin-top:10px;color:#d4dde5}

<script id="sf1149-pricing-safety-patch">
(function(){
  const isLimited=a=>!!(a&&(a.limited===true||a.isLimitedEdition===true||/limited edition/i.test(a.gallery||'')));
  const allStandardAudit=window.buildPriceAudit;
  window.buildPriceAudit=function(){
    const rows=allStandardAudit();
    return rows.filter(r=>!isLimited(r.artwork));
  };
  window.sf1149LimitedEditionHealth=function(){
    const arts=(state.artworks||[]).filter(isLimited);
    if(!arts.length)return '';
    return `<div class="card sf1149-protected"><h2>Limited Edition Price Protection</h2><p>Limited Editions are excluded from regular-product price corrections. Their prices are controlled by edition progress and pricing tiers, so <b>Apply all standard prices</b> cannot overwrite them.</p><div class="tablewrap"><table><thead><tr><th>Artwork</th><th>Edition progress</th><th>Next edition</th><th>Current tier</th><th>Protection</th></tr></thead><tbody>${arts.map(a=>{const size=Number(a.editionSize||0),sold=Number(a.editionsSold||0),next=size?Math.min(size+1,sold+1):sold+1,mult=editionMultiplier(a);return `<tr><td><b>${esc(a.title)}</b></td><td>${sold} / ${size||'not set'}</td><td>${size&&sold>=size?'Sold out':next}</td><td>${Number(mult).toFixed(2)}× starting prices</td><td><span class="sf1149-status">Protected</span></td></tr>`}).join('')}</tbody></table></div><div class="note"><b>Threshold behaviour:</b> when a recorded sale moves the next edition into a higher tier, StudioFlow flags the new tier for review. It does not silently replace Squarespace prices.</div></div>`;
  };
  const safeRender=window.renderPriceAudit;
  window.renderPriceAudit=function(){return safeRender()+window.sf1149LimitedEditionHealth()};

  function affectedProducts(rows){
    const products=[];
    for(const p of (liveStore?.products||[])){
      const artworkRows=rows.filter(x=>String(x.title||'').trim().toLowerCase()===String(p.title||'').trim().toLowerCase());
      if(!artworkRows.length)continue;
      let changed=0;
      const rewritten=p.rows.map(source=>{
        const r={...source}, parsed=parseLiveVariant(r), key=priceVariantKey(parsed);
        const update=artworkRows.find(x=>priceVariantKey(x)===key);
        if(update){r.Price=Number(update.newPrice||0).toFixed(2);changed++}
        return r;
      });
      if(changed)products.push({title:p.title,rows:rewritten,changed});
    }
    return products;
  }
  window.sf98ExportPendingUpdateCSV=async function(){
    const rows=(state.pendingPriceUpdates||[]).filter(x=>!x.limitedEditionProtected);
    if(!rows.length)return alert('There are no regular-product prices ready for a bulk Squarespace update. Limited Edition prices are protected and require edition-tier review.');
    if(!liveStore||!Array.isArray(liveStore.headers)||!liveStore.headers.length||!Array.isArray(liveStore.products)||!liveStore.products.length){
      return alert('Load your latest Squarespace product export in Update Manager first. StudioFlow must preserve Squarespace Product IDs, Variant IDs, options, and the original column structure.');
    }
    const products=affectedProducts(rows);
    if(!products.length)return alert('None of the queued prices matched the loaded Squarespace export. Check artwork titles and variant names, then load a fresh export. No file was created.');
    const exportRows=products.flatMap(p=>p.rows);
    const matched=products.reduce((n,p)=>n+p.changed,0);
    const csv=rowsToCSV(liveStore.headers,exportRows);
    const name='StudioFlow_Squarespace_Bulk_Price_Update.csv';
    try{
      if(window.studioflow?.saveText){
        const path=await window.studioflow.saveText({name,text:csv});
        if(!path)return;
        rows.forEach(x=>x.status='Squarespace-format CSV exported · awaiting confirmation');
        saveState();renderUpdates();
        return alert(`Created a Squarespace-compatible bulk update with ${matched} matched price change${matched===1?'':'s'} across ${products.length} product${products.length===1?'':'s'}.\n\nSaved to:\n${path}`);
      }
    }catch(err){console.error(err);return alert('The bulk price CSV could not be saved: '+err.message)}
    download(name,csv,'text/csv');
    rows.forEach(x=>x.status='Squarespace-format CSV exported · awaiting confirmation');saveState();renderUpdates();
    alert(`Created ${name} with ${matched} matched price change${matched===1?'':'s'}.`);
  };

  const originalFix=window.fixAuditPrice;
  window.fixAuditPrice=function(artworkId,keyEncoded,target){
    const a=(state.artworks||[]).find(x=>x.artworkId===artworkId);
    if(isLimited(a))return alert('Limited Edition pricing is protected. Change its starting price or edition tiers in the Limited Edition Tracker instead.');
    return originalFix(artworkId,keyEncoded,target);
  };
  const originalApply=window.applyAllStandardPrices;
  window.applyAllStandardPrices=function(){
    const limitedBefore=(state.artworks||[]).filter(isLimited).map(a=>({a,prices:(a.variants||[]).map(v=>v.price)}));
    originalApply();
    limitedBefore.forEach(x=>(x.a.variants||[]).forEach((v,i)=>v.price=x.prices[i]));
    saveState();
  };
})();
</script>


<script id="sf115-reference-csv-download-fix">
(function(){
  function csvCell(value){
    const text=String(value ?? '');
    return /[",\r\n]/.test(text) ? '"'+text.replace(/"/g,'""')+'"' : text;
  }
  function makeCSV(rows){
    return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
  }
  async function saveCSV(name, rows){
    const text=makeCSV(rows);
    if(window.studioflow && typeof window.studioflow.saveText==='function'){
      const path=await window.studioflow.saveText({name,text});
      return path || null;
    }
    const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const anchor=document.createElement('a');
    anchor.href=url;anchor.download=name;anchor.style.display='none';
    document.body.appendChild(anchor);anchor.click();anchor.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return 'Downloads folder';
  }
  window.sf91ExportPendingPrices=async function(){
    try{
      const rows=typeof sf91PendingPriceUpdates==='function' ? sf91PendingPriceUpdates() : (state.pendingPriceUpdates||[]);
      if(!rows.length){alert('There are no pending price corrections to export.');return;}
      const table=[
        ['Artwork ID','Title','Material','Size','Presentation','Previous Price','New Price','Status','Queued'],
        ...rows.map(x=>[x.artworkId||'',x.title||'',x.material||'',x.size||'',x.presentation||'',x.oldPrice??'',x.newPrice??'',x.status||'',x.queuedAt||x.createdAt||''])
      ];
      const path=await saveCSV('StudioFlow_Pending_Price_Corrections.csv',table);
      if(path) alert('Reference CSV saved successfully.\n\n'+path);
    }catch(error){
      console.error('Reference CSV export failed',error);
      alert('The reference CSV could not be created.\n\n'+(error?.message||String(error)));
    }
  };
})();
</script>
