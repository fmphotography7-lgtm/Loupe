<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  /* No external fonts, no network, no frameworks — this window has to paint on its first frame,
     because the whole reason it exists is to cover the moment before anything else can. */
  html,body{margin:0;height:100%;background:#05080e;overflow:hidden;cursor:pointer;
    font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
  #stage{position:absolute;inset:0}
  /* g121: the canvas used to paint on frame one while the video was still loading, so a moment of
     the procedural animation flashed before the film appeared. Everything now starts hidden; we
     reveal the film if there is one, or the canvas once we know there isn't. The window's own dark
     background covers the gap, which is a fraction of a second. */
  body.awaiting-film #sea,
  body.awaiting-film #logo,
  body.awaiting-film #tag,
  body.awaiting-film #barwrap{visibility:hidden}
  /* g115: CONTAIN, not cover. Kirk's film is 640x640 square; cropping it to fill a 1100x620
     window would scale it to 1100x1100 and cut the logo off top and bottom. Contain shows the
     whole frame and letterboxes onto the same dark background, and a 16:9 film in this window is
     within a whisker of the same aspect so it fills anyway. */
  #film{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;background:#05080e}
  body.film #sea,body.film #logo,body.film #tag{display:none}
  body.film #barwrap{bottom:11%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:70%;max-width:660px;height:auto;opacity:0;
    filter:drop-shadow(0 0 26px rgba(80,170,255,.45))}
  #tag{position:absolute;left:0;right:0;top:63%;text-align:center;color:#9fd0ff;
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;opacity:0}
  #barwrap{position:absolute;left:22%;right:22%;bottom:16%;opacity:0}
  #status{color:#7fc4ff;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    text-align:center;margin-bottom:9px;min-height:13px}
  #bar{height:2px;background:rgba(120,180,255,.16);border-radius:2px;overflow:hidden}
  #fill{height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,#1d6fd0,#63c8ff);
    box-shadow:0 0 10px rgba(99,200,255,.75);transition:width .35s ease}
  #skip{position:absolute;right:14px;bottom:10px;color:rgba(160,200,240,.35);font-size:10px;
    letter-spacing:.12em}
  body.done #stage{opacity:0;transition:opacity .32s ease}
</style></head>
<body class="awaiting-film">
<div id="stage">
  <!-- g114: if assets/splash.mp4 (or .webm) exists it plays and everything below is hidden.
       If it does not, the canvas animation runs exactly as before. The splash must never depend
       on a file that might not be there. -->
  <video id="film" muted playsinline preload="auto"></video>
  <canvas id="sea"></canvas>
  <!-- g113: the PNG is 512x512 and was being drawn at ~730px, so it was upscaled — that is the
     blockiness. Drawn as SVG instead: mathematically sharp at any window size or pixel ratio,
     and a few hundred bytes rather than 101KB. -->
<svg id="logo" viewBox="0 0 620 132" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/><stop offset=".45" stop-color="#9fd4ff"/>
      <stop offset=".55" stop-color="#4a9fe0"/><stop offset="1" stop-color="#bfe4ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="62" cy="66" r="52" fill="none" stroke="url(#glass)" stroke-width="3.4"/>
    <text x="62" y="82" text-anchor="middle" fill="url(#glass)"
          font-family="Georgia, 'Times New Roman', serif" font-style="italic"
          font-size="46" font-weight="700" letter-spacing="1">SF</text>
    <line x1="132" y1="20" x2="132" y2="112" stroke="url(#glass)" stroke-width="2.4"/>
    <text x="158" y="86" fill="url(#glass)"
          font-family="'Segoe UI Light','Segoe UI',system-ui,sans-serif"
          font-size="62" letter-spacing="0.5">StudioFlow</text>
  </g>
</svg>
  <div id="tag">Professional Photography Management</div>
  <div id="barwrap"><div id="status">Starting</div><div id="bar"><div id="fill"></div></div></div>
  <div id="skip">click to skip</div>
</div>
<script>
/* StudioFlow splash.
   Procedural, so no two launches look the same, but drawn in canvas 2D rather than WebGL: a shader
   has to compile before it draws, on whatever GPU driver the machine happens to have, and a black
   window during compilation would defeat the entire purpose of a splash.

   Three layers, all cheap:
     1. sand      — a static noise field baked ONCE into an offscreen canvas, not per frame
     2. waves     — summed sine curves with randomised phase/period per launch, plus a foam edge
     3. reveal    — how far up the logo the water has washed, which is what "uncovers" it

   The logo is the real glass asset, revealed by raising its opacity and wiping a gradient mask
   upward as each wave retreats — far more convincing than trying to simulate wet sand, and it
   cannot go wrong on a machine I have never seen. */
const cv = document.getElementById('sea'), ctx = cv.getContext('2d');
const logo = document.getElementById('logo');
/* g112: was capped at 2. On a high-DPI panel that upscales the canvas, which is the softness
   Kirk described as "low resolution". Render at the panel's true pixel ratio. */
let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
let sand = null;

function bakeSand() {
  // Baked once. Per-frame noise would cost more than the waves and look like television static.
  sand = document.createElement('canvas');
  sand.width = W; sand.height = H;
  const s = sand.getContext('2d');
  const g = s.createLinearGradient(0, H * 0.25, 0, H);
  g.addColorStop(0, '#0a121d'); g.addColorStop(1, '#131c26');
  s.fillStyle = g; s.fillRect(0, 0, W, H);
  /* g112: per-pixel random noise reads as television static once the canvas is rendered at full
     device resolution. Real wet sand has CORRELATED structure -- clumps and drag marks at several
     scales -- so lay down soft blobs at three sizes instead, then a wet sheen towards the water. */
  for (const [count, size, alpha] of [[900, 26, .050], [2600, 10, .045], [7000, 3.2, .055]]) {
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W, y = H * 0.18 + Math.random() * H * 0.82;
      const light = Math.random() > 0.5;
      s.fillStyle = light ? `rgba(150,178,205,${alpha})` : `rgba(0,6,14,${alpha * 1.5})`;
      s.beginPath();
      s.ellipse(x, y, size * dpr * (0.6 + Math.random()), size * dpr * (0.35 + Math.random() * 0.5),
                Math.random() * 3.14, 0, 6.283);
      s.fill();
    }
  }
  const sheen = s.createLinearGradient(0, H * 0.35, 0, H);
  sheen.addColorStop(0, 'rgba(90,150,210,0.10)');
  sheen.addColorStop(0.55, 'rgba(50,95,150,0.05)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.16)');
  s.fillStyle = sheen; s.fillRect(0, 0, W, H);
}
function resize() {
  W = Math.floor(cv.clientWidth * dpr); H = Math.floor(cv.clientHeight * dpr);
  cv.width = W; cv.height = H; bakeSand();
}
window.addEventListener('resize', resize);

/* Randomised per launch — this is what makes each start slightly different. */
/* Four waves now, not three: Kirk is happy for the animation to outlast the load, so the sequence
   can breathe and reach a proper final reveal instead of being cut off mid-story. */
const waves = [0, 1, 2, 3].map(i => ({
  phase: Math.random() * Math.PI * 2,
  period: 2600 + Math.random() * 900 + i * 240,
  amp: 0.055 + Math.random() * 0.03,
  reach: 0.26 + i * 0.17 + Math.random() * 0.05
}));

let start = performance.now(), revealed = 0, closing = false;

function draw(now) {
  const t = now - start;
  ctx.drawImage(sand, 0, 0);

  // Each wave runs in and out on its own cycle; the furthest reach so far is what has been
  // uncovered, so the reveal only ever moves forward -- water retreating never re-buries the logo.
  let front = 0;
  waves.forEach((w, i) => {
    const local = (t - i * 700) / w.period;
    if (local < 0) return;
    const swell = Math.sin(Math.min(local, 1) * Math.PI);     // in, then out
    const y = H * (1 - w.reach * swell);
    front = Math.max(front, w.reach * swell);

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const ripple = Math.sin(x / (W / 5) + w.phase + t / 620) * H * w.amp * 0.35
                   + Math.sin(x / (W / 11) - t / 900) * H * w.amp * 0.18;
      ctx.lineTo(x, y + ripple);
    }
    ctx.lineTo(W, H); ctx.closePath();

    const wg = ctx.createLinearGradient(0, y - H * 0.1, 0, H);
    wg.addColorStop(0, 'rgba(90,190,255,0.50)');
    wg.addColorStop(0.35, 'rgba(24,86,168,0.42)');
    wg.addColorStop(1, 'rgba(6,20,40,0.30)');
    ctx.fillStyle = wg; ctx.fill();

    // Foam sits on the leading edge only, brightest at the peak of the run.
    ctx.save(); ctx.clip();
    ctx.strokeStyle = `rgba(190,235,255,${0.30 + 0.45 * swell})`;
    ctx.lineWidth = 2 * dpr; ctx.stroke();
    ctx.restore();
  });

  revealed = Math.max(revealed, Math.min(1, front / 0.62));
  logo.style.opacity = revealed.toFixed(3);
  // The mask wipes upward with the water rather than fading the whole logo at once.
  const cut = (1 - revealed) * 100;
  logo.style.webkitMaskImage = logo.style.maskImage =
    `linear-gradient(to top, #000 ${Math.max(0, 100 - cut - 12)}%, transparent ${Math.max(0, 100 - cut)}%)`;

  if (revealed > 0.55) document.getElementById('tag').style.opacity = ((revealed - 0.55) / 0.45).toFixed(2);
  if (t > 900) document.getElementById('barwrap').style.opacity = '1';

  // Drifting motes, only once there is something to drift over.
  if (revealed > 0.2) {
    for (let i = 0; i < 14; i++) {
      const seed = i * 97.3;
      const x = ((seed * 53) % W + Math.sin(t / 1400 + seed) * 26 * dpr) % W;
      const y = H - ((t / 22 + seed * 31) % (H * 0.8));
      ctx.fillStyle = `rgba(140,215,255,${0.10 + 0.22 * Math.abs(Math.sin(t / 700 + seed))})`;
      ctx.fillRect(x, y, 1.6 * dpr, 1.6 * dpr);
    }
  }
  if (!closing) requestAnimationFrame(draw);
}

/* Progress comes from the main process — real startup stages, not a timer pretending to be one. */
window.studioflowSplash?.onStage((stage) => {
  document.getElementById('status').textContent = stage.label;
  document.getElementById('fill').style.width = Math.round(stage.percent) + '%';
});
window.studioflowSplash?.onDismiss(() => {
  closing = true;
  document.body.classList.add('done');
});
document.body.onclick = () => window.studioflowSplash?.skip();

/* Try the film first. Nothing here is allowed to prevent the splash appearing: if the file is
   absent, unreadable or the codec is unsupported, we simply never switch and the canvas plays. */
(function tryFilm(){
  const film = document.getElementById('film');
  const sources = ['assets/splash.mp4', 'assets/splash.webm'];
  let i = 0;
  /* Reveal the canvas the moment we know no film is coming — whether that is because every
     source failed, or because nothing has loaded within a short grace period. */
  let settled = false;
  const showCanvas = () => {
    if (settled) return;
    settled = true;
    document.body.classList.remove('awaiting-film');
  };
  const attempt = () => {
    if (i >= sources.length) { showCanvas(); return; }
    film.src = sources[i++];
    film.load();
  };
  /* A slow disk should not mean a blank window: if the film has not started by now, play the
     animation instead. It stays hidden if the film arrives later. */
  setTimeout(() => { if (!document.body.classList.contains('film')) showCanvas(); }, 900);
  film.addEventListener('canplay', () => {
    settled = true;                                  // a film exists: never show the canvas
    document.body.classList.remove('awaiting-film');
    document.body.classList.add('film');
    film.style.display = 'block';
    film.play().catch(() => {                        // autoplay refused: fall back rather than sit black
      document.body.classList.remove('film');
      film.style.display = 'none';
      settled = false; showCanvas();
    });
  }, { once: false });
  film.addEventListener('error', attempt);
  /* Hold the last frame instead of looping or going black -- the splash may outlast the film. */
  film.addEventListener('ended', () => { try { film.pause(); } catch (_) {} });
  attempt();
})();

resize();
requestAnimationFrame(draw);
</script>
</body></html>
