<body>
<div class="app-shell sf8-shell">
  <aside class="sidebar sf8-sidebar">
    <div class="brand sf8-brand">
      <img src="assets/studioflow-metal-logo.png" class="studioflow-metal-logo" alt="StudioFlow metallic SF logo">
      <div class="brand-copy sf8-brand-copy">
        <strong>STUDIOFLOW</strong>
        <small>CREATE. DESIGN. FLOW.</small>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
    </div>
    <nav id="navigation" class="sf8-navigation"></nav>

    <div class="sidebar-footer sf8-sidebar-footer">
      <div class="sf8-version">StudioFlow 4.0 · build g209</div>

      <div class="sf8-workspace-state"><span class="online-dot"></span><span>Local workspace ready</span></div>

  <main class="main-area sf8-main">
    <header class="topbar sf8-topbar">
      <div class="sf8-page-heading">
        <small id="eyebrow">STUDIOFLOW</small>
        <h1 id="pageTitle">Home Dashboard</h1>
      </div>

      <section id="businessBanner" class="business-banner sf8-business-banner">
        <img id="businessBannerLogo" class="business-banner-logo hidden" alt="Business logo">
        <div class="sf8-business-copy">
          <div id="businessBannerName" class="business-banner-name">Your Photography Business</div>
          <small>Fine Art Photography Workspace</small>
        </div>
      </section>

      <div class="top-actions sf8-top-actions">
        <button class="sf8-icon-button" id="topAddArtwork" title="Add artwork" aria-label="Add artwork">＋</button>
        <button class="button sf8-export-button" id="topBackup">Export Backup</button>
      </div>
    </header>

    <section id="workspace" class="sf8-workspace"></section>
  </main>
</div>

<!-- render-engine-core.js removed: it monkey-patched draw() and finishedSize() with its own
     normalizeModel() step that force-clamps imageWidth/matWidth/frameWidth/scale/rotation/
     perspective/zoom/x/y to its own fixed ranges on every single redraw, and separately
     recomputed and re-clamped placement x/y against its own bounds calculation. This is what
     was causing sliders and controls to appear to silently revert after being changed -- the
     wrapped draw() call kept re-applying its own limits on top of whatever room-designer.js
     had just set. Nothing else in the app reads window.SFRenderEngine. -->

     shadow style with its own older, independent positioning math via !important on every single frame,
     which is why shadow fixes in room-designer.js/styles.css were never actually taking visual effect. -->
